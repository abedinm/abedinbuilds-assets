<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b27"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ea8fe"/>
      <stop offset="1" stop-color="#9b8cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.25" r="0.8">
      <stop offset="0" stop-color="#6ea8fe" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6ea8fe" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <rect width="800" height="800" fill="url(#glow)"/>
  <circle cx="120" cy="680" r="180" fill="#9b8cff" opacity="0.08"/>
  <circle cx="690" cy="120" r="140" fill="#6ea8fe" opacity="0.1"/>
  <!-- figure -->
  <circle cx="400" cy="330" r="130" fill="url(#accent)" opacity="0.9"/>
  <path d="M150 800 C150 600 270 520 400 520 C530 520 650 600 650 800 Z" fill="url(#accent)" opacity="0.75"/>
  <circle cx="400" cy="330" r="130" fill="none" stroke="#e8ecf4" stroke-opacity="0.12" stroke-width="2"/>
  <!-- floating ui chips -->
  <g font-family="Arial, sans-serif" font-weight="bold">
    <rect x="540" y="430" width="150" height="48" rx="24" fill="#121620" stroke="#222a39"/>
    <circle cx="566" cy="454" r="7" fill="#3ddc84"/>
    <text x="584" y="460" fill="#e8ecf4" font-size="17">Available</text>
    <rect x="105" y="200" width="130" height="48" rx="24" fill="#121620" stroke="#222a39"/>
    <text x="128" y="230" fill="#6ea8fe" font-size="17">&lt;/&gt; Dev</text>
  </g>
  <text x="400" y="775" text-anchor="middle" fill="#97a3b6" font-family="Arial, sans-serif" font-size="15" opacity="0.55">Replace with your photo — images/portrait.svg</text>
</svg>
